name: Deploy Mural

on:
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

env:
  GCP_WORKLOAD_IDENTITY_POOL_ID: github-deployer-auth-pool
  GCP_WORKLOAD_IDENTITY_PROVIDER_ID: github-deployer-auth-provider
  GCP_SERVICE_ACCOUNT_EMAIL: github-deployer-ancgames@ancgames-prod.iam.gserviceaccount.com
  GKE_CLUSTER: ancgames-cluster
  GKE_ZONE: us-east1
  GCP_PROJECT_ID: ancgames-prod
  IMAGE: mural
  DEPLOYMENT_NAME: ancgames
  DOCKER_REGISTRY: us-east1-docker.pkg.dev
  DOCKER_REPOSITORY: ancgames-docker
  DOCKER_IMAGE: us-east1-docker.pkg.dev/ancgames-prod/ancgames-docker/mural:${{ github.sha }}

jobs:
  deploy_image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.0.0
        with:
          workload_identity_provider: 'projects/844886450846/locations/global/workloadIdentityPools/${{ env.GCP_WORKLOAD_IDENTITY_POOL_ID }}/providers/${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER_ID }}'
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }} ./code

      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE }}

  deploy_to_gke:
    runs-on: ubuntu-latest
    needs: deploy_image
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.0.0
        with:
          workload_identity_provider: 'projects/844886450846/locations/global/workloadIdentityPools/${{ env.GCP_WORKLOAD_IDENTITY_POOL_ID }}/providers/${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER_ID }}'
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
      
          # Get the GKE credentials so we can deploy to the cluster
      - uses: google-github-actions/get-gke-credentials@db150f2cc60d1716e61922b832eae71d2a45938f
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
             # Set up kustomize

      - name: Set up Kustomize
        run: |-
          cd ./code/iac
          curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
          chmod u+x ./kustomize
          cd ..

      # Deploy the Docker image to the GKE cluster
      - name: Deploy
        run: |-
          cd ./code/iac
          ./kustomize edit set image ${{ env.DOCKER_IMAGE }}
          ./kustomize build . | kubectl apply -f -
          cd ..
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}
          kubectl get services -o wide
