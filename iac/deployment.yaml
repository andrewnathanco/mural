apiVersion: apps/v1
kind: Deployment
metadata:
  name: ancgames-mural
  labels:
    app: ancgames-mural
spec:
  selector:
    matchLabels:
      app: ancgames-mural
      tier: web
  template:
    metadata:
      labels:
        app: ancgames-mural
        tier: web
    spec:
      containers:
      - name: ancgames-mural
        image: us-east1-docker.pkg.dev/ancgames-prod/ancgames-docker/mural:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m